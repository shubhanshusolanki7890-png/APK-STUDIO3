name: Build APK STUDIO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project Archive
        run: |
          unzip -q "APK-STUDIO(1).zip"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Platform 34 and Build-Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Grant Execute Permission to Gradle Wrapper
        run: |
          chmod +x APK-STUDIO/APK-STUDIO/build-engine/android-template/gradlew

      - name: Compile Debug APK
        working-directory: APK-STUDIO/APK-STUDIO/build-engine/android-template
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: APK-STUDIO/APK-STUDIO/build-engine/android-template/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
