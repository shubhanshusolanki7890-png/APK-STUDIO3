name: Build APK STUDIO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Project and Build
        run: |
          unzip -q "APK-STUDIO(1).zip" -d extracted_app
          ANDROID_DIR=$(dirname $(find extracted_app -name gradlew | head -n 1))
          echo "Android template directory: $ANDROID_DIR"
          cd "$ANDROID_DIR"

          chmod +x gradlew

          # Build without daemon & disable configuration cache to avoid dependency mutation conflict
          ./gradlew assembleDebug --no-daemon --no-build-cache --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: extracted_app/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
