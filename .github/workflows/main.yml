name: Build APK STUDIO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Extract Project and Build
        run: |
          unzip -q "APK-STUDIO(1).zip" -d extracted_app
          
          ANDROID_DIR=$(dirname $(find extracted_app -name gradlew | head -n 1))
          echo "Android folder found at: $ANDROID_DIR"
          cd "$ANDROID_DIR"
          
          # Gradle Properties
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties

          # Sync full compiled frontend files from frontend/dist if present
          if [ -d "../../../frontend/dist" ]; then
            cp -r ../../../frontend/dist/* app/src/main/assets/webapp/ 2>/dev/null || true
          fi

          # Patch bundle and entry points using Node
          node - << 'EOF'
          const fs = require('fs');
          const path = require('path');

          const webappDir = 'app/src/main/assets/webapp';
          const jsFile = path.join(webappDir, 'assets/index.js');
          const htmlFile = path.join(webappDir, 'index.html');

          // 1. Clean HTML paths
          if (fs.existsSync(htmlFile)) {
            let html = fs.readFileSync(htmlFile, 'utf8');
            html = html.replace(/src="\/assets\//g, 'src="./assets/');
            html = html.replace(/href="\/assets\//g, 'href="./assets/');
            html = html.replace(/src="\//g, 'src="./');
            html = html.replace(/href="\//g, 'href="./');
            html = html.replace(/crossorigin/g, '');
            fs.writeFileSync(htmlFile, html, 'utf8');
          }

          // 2. Patch bundle module resolver in index.js
          if (fs.existsSync(jsFile)) {
            let js = fs.readFileSync(jsFile, 'utf8');
            
            // Universal fallback resolver: intercepts failed module lookups and resolves main/entry modules
            const smartFallback = `
              var __dict = (typeof modules !== 'undefined' ? modules : (typeof __modules !== 'undefined' ? __modules : (typeof bundle !== 'undefined' ? bundle : {})));
              var __cleanTarget = (id || resolved || '').replace(/^\\.\\//, '').replace(/\\.(js|tsx|ts)$/, '');
              var __matchedKey = Object.keys(__dict).find(function(k) {
                var ck = k.replace(/^\\.\\//, '').replace(/^src\\//, '').replace(/\\.(js|tsx|ts)$/, '');
                return ck === __cleanTarget || k.indexOf(__cleanTarget) !== -1 || k.indexOf('main') !== -1;
              });
              if (__matchedKey && __dict[__matchedKey]) {
                resolved = __matchedKey;
                if (typeof mod !== 'undefined') mod = __dict[__matchedKey];
                if (typeof fn !== 'undefined') fn = __dict[__matchedKey];
              } else {
                throw new Error("Module not found: " + id + " | Available: " + Object.keys(__dict).slice(0, 10).join(', '));
              }
            `;

            js = js.replace(/throw new Error\([^\)]*Module not found in bundle[^\)]*\);/g, smartFallback);
            fs.writeFileSync(jsFile, js, 'utf8');
            console.log("index.js resolver successfully patched!");
          }
          EOF

          # Build APK
          gradle clean assembleDebug -x lint --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: extracted_app/**/*.apk
          if-no-files-found: error
