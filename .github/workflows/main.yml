name: Build APK STUDIO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Project and Build
        run: |
          unzip -q "APK-STUDIO(1).zip" -d extracted_app
          
          # Find the exact folder containing gradlew
          ANDROID_DIR=$(dirname $(find extracted_app -name gradlew | head -n 1))
          echo "Found Android project at: $ANDROID_DIR"
          
          # Go to that directory and build
          cd "$ANDROID_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Find and Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: extracted_app/**/app/build/outputs/apk/debug/*.apk
