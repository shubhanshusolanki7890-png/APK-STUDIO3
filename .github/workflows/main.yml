name: Build APK STUDIO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Project and Build
        run: |
          unzip -q "APK-STUDIO(1).zip" -d extracted_app
          
          ANDROID_DIR=$(dirname $(find extracted_app -name gradlew | head -n 1))
          cd "$ANDROID_DIR"
          
          # Increase memory to avoid GitHub Actions crashing at the last step
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties

          chmod +x gradlew
          
          # Skip strict lint checks (-x lint) that block final APK generation
          ./gradlew clean assembleDebug -x lint --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: extracted_app/**/*.apk
          if-no-files-found: error
