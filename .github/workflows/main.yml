name: Build APK STUDIO

on:
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Extract project archive
    run: |
      unzip -q "APK-STUDIO(1).zip" -d extracted
      test -f extracted/APK-STUDIO/APK-STUDIO/package.json
      test -f extracted/APK-STUDIO/APK-STUDIO/build-engine/android-template/app/build.gradle

  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: '20'

  - name: Install dependencies and build frontend
    working-directory: extracted/APK-STUDIO/APK-STUDIO
    run: |
      npm install
      npm run build

  - name: Run automated tests
    working-directory: extracted/APK-STUDIO/APK-STUDIO
    run: npm test

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK components
    run: |
      yes | sdkmanager --licenses || true
      sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

  - name: Build debug APK
    working-directory: extracted/APK-STUDIO/APK-STUDIO/build-engine/android-template
    run: |
      chmod +x gradlew
      ./gradlew assembleDebug --no-daemon

  - name: Upload debug APK
    uses: actions/upload-artifact@v4
    with:
      name: APK-STUDIO-debug
      path: extracted/APK-STUDIO/APK-STUDIO/build-engine/android-template/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
